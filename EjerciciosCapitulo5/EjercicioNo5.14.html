<head>
    <meta charset="utf-8">
    <title>Ejercicio 5.14</title>
    <link rel="stylesheet" type="text/css" href="/Estilos/Botones.css">
    <style type="text/css">
        img {
            margin: 30px;
            -webkit-transition: -webkit-transform 0.4s;
            -moz-transition: -moz-transform 0.4s;
            -o-transition: -o-transform 0.4s;
            transition: transform 0.4s;
        }

        img:hover {
            -webkit-transform: scale(1.2, 1.2);
            -moz-transform: scale(1.2, 1.2);
            -o-transform: scale(1.2, 1.2);
            transform: scale(1.2, 1.2);
        }

        footer {
            clear: both;
            margin-top: 40px;
            font-family: sans-serif;
        }
    </style>
</head>

<body>
    <h1>Ejercicio 5.14</h1>
    <hr>
    <p><b>(Transformación con :hover)</b> Cree un programa de transformación que incluya cuatro imágenes. 
        Cuando el usuario pase el ratón sobre una imagen, el tamaño de esta debe aumentar por un 20%
    </p>
    <hr>
    <img src="/Resources/ocean.png" width="180" height="120" alt="Recurso no encontrado de Imagen 1">
